services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landing-back
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

  # Desarrollo con hot-reload (Node 24)
  app-dev:
    image: node:24-alpine
    container_name: landing-back-dev
    working_dir: /app
    volumes:
      - .:/app
      - landing_back_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    profiles:
      - dev

volumes:
  landing_back_node_modules:
